services:
  # =========================================================================
  # BACKEND: Menjalankan aplikasi utama Frappe/ERPNext
  # =========================================================================
  backend:
    image: frappe/erpnext:${ERP_VERSION}
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    networks:
      - default
      - net-caddy

  # =========================================================================
  # CONFIGURATOR: Mengatur konfigurasi global aplikasi
  # =========================================================================
  configurator:
    image: frappe/erpnext:${ERP_VERSION}
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host ${DB_HOST};
        bench set-config -gp db_port ${DB_PORT};
        bench set-config -g redis_cache "redis://${REDIS_CACHE}";
        bench set-config -g redis_queue "redis://${REDIS_QUEUE}";
        bench set-config -g redis_socketio "redis://${REDIS_QUEUE}";
        bench set-config -gp socketio_port ${SOCKETIO_PORT};
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      REDIS_CACHE: ${REDIS_CACHE}
      REDIS_QUEUE: ${REDIS_QUEUE}
      SOCKETIO_PORT: ${SOCKETIO_PORT}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  # =========================================================================
  # CREATE-SITE: Inisialisasi Database & Migrate (Logika IF-ELSE)
  # =========================================================================
  create-site:
    image: frappe/erpnext:${ERP_VERSION}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint: [bash, -c]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;

        # Cek apakah folder site sudah ada
        if [ -d "sites/${SITE_NAME}" ]; then
          echo "Site '${SITE_NAME}' ditemukan. Menjalankan migrate...";
          bench --site ${SITE_NAME} migrate;
        else
          echo "Membuat site baru: ${SITE_NAME}...";
          bench new-site ${SITE_NAME} \
            --no-mariadb-socket \
            --admin-password=${ADMIN_PASSWORD} \
            --db-root-password=${MYSQL_ROOT_PASSWORD} \
            --install-app erpnext \
            --set-default;
        fi

  # =========================================================================
  # DB: Database MariaDB
  # =========================================================================
  db:
    image: mariadb:${MARIADB_VERSION}
    restart: unless-stopped
    healthcheck:
      test: mysqladmin ping -h localhost --password=${MYSQL_ROOT_PASSWORD}
      interval: 10s
      retries: 5
    networks:
      - default
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  # =========================================================================
  # FRONTEND: Nginx Proxy untuk melayani file statis
  # =========================================================================
  frontend:
    image: frappe/erpnext:${ERP_VERSION}
    depends_on: [websocket, backend]
    restart: unless-stopped
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8085:8080"
    networks:
      - default
      - net-caddy

  # =========================================================================
  # WORKERS, REDIS, SCHEDULER & WEBSOCKET
  # =========================================================================
  queue-long:
    image: frappe/erpnext:${ERP_VERSION}
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-short:
    image: frappe/erpnext:${ERP_VERSION}
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes: [redis-queue-data:/data]

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes: [redis-cache-data:/data]

  scheduler:
    image: frappe/erpnext:${ERP_VERSION}
    restart: unless-stopped
    command: [bench, schedule]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    image: frappe/erpnext:${ERP_VERSION}
    restart: unless-stopped
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

volumes:
  db-data:
  redis-queue-data:
  redis-cache-data:
  sites:
  logs:

networks:
  default:
  net-caddy:
    external: true
    name: net-caddy
